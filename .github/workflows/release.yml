name: Release
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 ffmpeg libgl1 libportaudio2
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python tools/prepare_assets.py --models-only
      - run: .venv/bin/python -m unittest test_gestures test_controls test_i18n test_bootstrap test_cli test_lasers test_reactions test_preview_stream test_hagrid test_lifecycle -v
      - run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 -m unittest test_panel test_preview -v
      - run: python tools/build_deb.py
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handspark-ubuntu24.04-amd64
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "HandSpark $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --verify-tag --latest
