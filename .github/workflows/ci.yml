name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 libgl1 libportaudio2
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m unittest test_gestures test_controls test_i18n test_bootstrap test_cli test_lasers -v
      - run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 -m unittest test_panel -v
